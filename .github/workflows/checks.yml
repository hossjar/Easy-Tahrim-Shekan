name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate generated configuration with the pinned image
        run: python tests/check_runtime.py
